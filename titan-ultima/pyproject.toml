[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-ultima"
dynamic = ["version"]
description = "TITAN – Tool for Interpreting and Transforming Archival Nodes. CLI and library for Ultima file formats: Ultima 6, 7, 8 and 9, Martian Dreams, Ultima Underworld I and II, Ultima Online and Ultima 3 (NES)."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "theGreyWanderer", email = "196163911+theGreyWanderer-uc@users.noreply.github.com" }]
keywords = [
    "ultima", "ultima8", "ultima7", "u8", "u7", "pagan", "black-gate", "serpent-isle",
    "ultima6", "ultima9", "u6", "u9", "martian-dreams", "ultima-underworld", "ultima-online",
    "game-modding", "mod-tools", "asset-extraction", "file-formats",
    "flex", "shapes", "xmidi",
    "cli", "batch-processing",
    "retro-gaming", "graphics-conversion", "sound-export",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: File Formats",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "typer>=0.15",
    "freetype-py>=2.5",
    "questionary>=2.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    'tomli>=2.0; python_version < "3.11"',
    "tomli-w>=1.0",
]

[project.optional-dependencies]
glb = [
    "trimesh>=4.0",
]
test = [
    "pytest>=8.0",
]
lint = [
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/theGreyWanderer-uc/tgwUltima"
Repository = "https://github.com/theGreyWanderer-uc/tgwUltima"
Changelog = "https://github.com/theGreyWanderer-uc/tgwUltima/blob/main/titan-ultima/CHANGELOG.md"
"Bug Tracker" = "https://github.com/theGreyWanderer-uc/tgwUltima/issues"

[tool.hatch.version]
path = "src/titan/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]
# Exclude luts and bundled fonts from package auto-discovery (non-Python data)
# to prevent hatchling from adding binary files twice. Re-include via force-include.
exclude = [
    "src/titan/adaptive_resample/luts",
    "src/titan/fonts/bundled",
    "src/titan/dialogue/pipeline/resources",
    "src/titan/dialogue/websrc",
    "src/titan/dialogue/webbundle",
    "src/titan/third_party/fold",
    "src/titan/uo/resources",
    "src/titan/u9/resources",
]

[tool.hatch.build.targets.wheel.force-include]
"src/titan/u9/resources" = "titan/u9/resources"
"src/titan/adaptive_resample/luts" = "titan/adaptive_resample/luts"
"src/titan/fonts/bundled" = "titan/fonts/bundled"
"src/titan/dialogue/pipeline/resources" = "titan/dialogue/pipeline/resources"
"src/titan/dialogue/websrc/public/meta" = "titan/dialogue/websrc/public/meta"
"src/titan/dialogue/webbundle" = "titan/dialogue/webbundle"
"src/titan/third_party/fold" = "titan/third_party/fold"
"src/titan/uo/resources" = "titan/uo/resources"

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv",
    ".venv/**",
    ".venv-*/**",
    ".env",
    ".env/**",
    "env/**",
    "venv/**",
    "build/**",
    "dist/**",
    "**/node_modules/**",
    "src/titan/dialogue/websrc/public/data/**",
    "src/titan/dialogue/websrc/dist/**",
    "src/titan/dialogue/websrc/playwright-report/**",
    "src/titan/dialogue/websrc/test-results/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src/titan/u9/resources" = "src/titan/u9/resources"
"src/titan/dialogue/webbundle" = "src/titan/dialogue/webbundle"
"src/titan/uo/resources" = "src/titan/uo/resources"

[project.scripts]
titan = "titan.cli:main"

[tool.pytest.ini_options]
# Keep collection to the suite; scratch output folders may hold stray test files.
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Vendored third-party code keeps its upstream style.
extend-exclude = ["src/titan/adaptive_resample/resize_right"]

[tool.ruff.lint]
# Ruff's default rule set: pycodestyle errors and Pyflakes. CI enforces it.
select = ["E4", "E7", "E9", "F"]
